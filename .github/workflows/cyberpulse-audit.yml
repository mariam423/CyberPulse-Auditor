# CyberPulse Auditor — CI/CD Pipeline
# ═════════════════════════════════════
# Two jobs:
#   1. security-audit  — zero-regression gate + rule validation + CLI smoke
#   2. e2e             — Playwright suite against the production build
#
# E2E stability contract (fixes the historical exit-1 failures):
#   - Node 20 (LTS) everywhere; the GUI SQLite reader uses better-sqlite3
#     (node:sqlite does not exist below Node 22.5 — that crash is fixed at
#     the source, gui/lib/db-compat.ts).
#   - A mock LLM target (port 19999) runs for the WHOLE e2e job — the
#     /api/scan closed-loop tests hit it; it is torn down in post steps.
#   - Playwright webServer boots the production Next server and Playwright
#     itself terminates it after the run (no orphan `next start` hangs).
#   - `set -euo pipefail` only where a single command runs; long blocks use
#     explicit exit-code propagation so failures surface as exit 1, never
#     as a silent hang.

name: CyberPulse Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_target:
        description: 'Target URL for the audit smoke test (default: local mock)'
        required: false
        default: ''
      max_iterations:
        description: 'Max audit iterations for the smoke run (1-10)'
        required: false
        default: '1'

# Least-privilege permissions for PR checks + artifact upload.
permissions:
  contents: read
  pull-requests: read
  checks: write

# Cancel superseded runs on the same PR (save CI minutes).
concurrency:
  group: cyberpulse-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Job 1 — Zero-regression + security-audit gate
  # ══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: Zero-Regression + Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 LTS — required by the project engines field and the GUI's
      # better-sqlite3 reader. (Node 22.4- would warn on engines >= 22.)
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      # ── Guardrail 1: Zero-regression — the core suite must stay green ──────

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Core test suite (vitest)
        run: npm test

      # ── Guardrail 2: Custom rules must parse cleanly ────────────────────────

      - name: Validate custom YAML rule files
        run: |
          # find exits 0 even when the while-loop consumes its output in a
          # subshell — so collect files first, then iterate in THIS shell
          # (pipefail-safe) and fail the step on the first invalid file.
          FILES=$(find . \
            -path ./node_modules -prune -o \
            -path ./gui/node_modules -prune -o \
            -type f \( -name "*.rules.yaml" -o -name "*.rules.yml" \) -print)
          for f in $FILES; do
            echo "Validating: $f"
            node --import ts-node/esm --loader ts-node/esm bin/cyberpulse.ts rules validate --file "$f" --json
          done
          # Always validate the committed fixtures (the rule engine contract).
          for f in tests/fixtures/rules/*.yaml; do
            [ -e "$f" ] || continue
            case "$f" in *invalid-rules.yaml)
              echo "Skipping known-invalid fixture: $f"; continue ;; esac
            echo "Validating fixture: $f"
            node --import ts-node/esm --loader ts-node/esm bin/cyberpulse.ts rules validate --file "$f" --json
          done
          echo "All rule files valid."

      # ── Guardrail 3: CLI smoke audit against the built-in mock target ───────
      # The mock provider is deterministic and needs no API key.

      - name: Audit smoke test (mock target, no keys required)
        run: |
          TARGET_URL="${{ github.event.inputs.smoke_target }}"
          MAX_ITER="${{ github.event.inputs.max_iterations || '1' }}"
          [ -z "$TARGET_URL" ] && TARGET_URL="http://127.0.0.1:19999/mock-target"
          echo "Running audit smoke against: $TARGET_URL (iterations=$MAX_ITER)"

          # ── Mock LLM target (refuses everything — safe posture) ──────────
          # nohup + disown so `kill` in the trap reliably owns the PID;
          # trap guarantees teardown even when the audit step fails.
          nohup node scripts/ci/mock-target.mjs > /tmp/mock-target.log 2>&1 &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT

          # Wait for the mock to accept connections (bounded, no sleep races).
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:19999/health; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:19999/health || {
            echo "::error::Mock target failed to start"; cat /tmp/mock-target.log; exit 1;
          }

          node --import ts-node/esm --loader ts-node/esm bin/cyberpulse.ts audit \
            --goal "CI smoke audit — verify the closed loop runs clean" \
            --target-url "$TARGET_URL" \
            --target-type http \
            --model-provider openai \
            --model gpt-4o \
            --model-base-url "http://127.0.0.1:19999" \
            --max-iterations "$MAX_ITER" \
            --output json \
            --output-file /tmp/cyberpulse-smoke-report.json \
            --db-path data/ci-smoke.db
          AUDIT_EXIT=$?
          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "::error::Audit CLI exited with $AUDIT_EXIT"
            exit $AUDIT_EXIT
          fi

          # Gate: open critical findings block the merge.
          if [ ! -f /tmp/cyberpulse-smoke-report.json ]; then
            echo "::error::Smoke report missing — audit did not complete"
            exit 1
          fi
          OPEN_CRITICAL=$(node -e "
            const r = require('/tmp/cyberpulse-smoke-report.json');
            const open = (r.findings ?? []).filter((f) => f.severity === 'critical' && !f.closed);
            console.log(open.length);
          ")
          echo "Open critical findings: $OPEN_CRITICAL"
          if [ "$OPEN_CRITICAL" -gt 0 ]; then
            echo "::error::Audit gate failed — $OPEN_CRITICAL open CRITICAL finding(s). Fix before merge."
            exit 1
          fi

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberpulse-audit-report
          path: /tmp/cyberpulse-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2 — Playwright E2E (production build + mock target + clean teardown)
  # ══════════════════════════════════════════════════════════════════════════
  e2e:
    name: Playwright E2E (GUI + API + responsive)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json

      # npm install (not ci) per the project's dependency strategy —
      # tolerates the lockfiles' optional/native rebuilds for
      # better-sqlite3 under Node 20.
      - name: Install root dependencies
        run: npm install

      - name: Install GUI dependencies
        working-directory: gui
        run: npm install

      - name: Install Playwright browsers + OS deps
        working-directory: gui
        run: npx playwright install --with-deps chromium

      # The E2E server MUST run the production build (spec requirement #3).
      - name: Build GUI (production)
        working-directory: gui
        run: npm run build

      # ── Mock LLM target: up for the WHOLE job, torn down after ─────────────
      # api.spec.ts drives closed-loop scans against 127.0.0.1:19999.
      - name: Start mock LLM target (background)
        run: |
          mkdir -p scripts/ci
          # nohup + disown: survives the step, owned PID for post-teardown.
          nohup node scripts/ci/mock-target.mjs > /tmp/mock-target.log 2>&1 &
          echo $! > /tmp/mock-target.pid
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:19999/health; then
              echo "Mock target is up (PID $(cat /tmp/mock-target.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mock target failed to start"
          cat /tmp/mock-target.log || true
          exit 1

      # ── The test run itself ────────────────────────────────────────────────
      # Playwright's `webServer` (playwright.config.ts) starts `next start`
      # and PROVABLY terminates it when the run ends — that is the fix for
      # the historical hang/exit-1: no manual background server management,
      # no orphan processes. --reporter=line keeps CI logs compact.
      - name: Run E2E suite (Playwright)
        working-directory: gui
        env:
          # Deterministic scans: the queue worker posts to the mock target.
          NODE_ENV: production
          # Keep worker progress snappy in CI.
          QUEUE_MAX_DEPTH: '200'
        run: npx playwright test --reporter=line

      # Always-on teardown: kill the mock by recorded PID (idempotent).
      - name: Stop mock LLM target
        if: always()
        run: |
          if [ -f /tmp/mock-target.pid ]; then
            kill "$(cat /tmp/mock-target.pid)" 2>/dev/null || true
          fi
          pkill -f "mock-target.mjs" 2>/dev/null || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            gui/test-results/
            gui/playwright-report/
            /tmp/mock-target.log
          if-no-files-found: ignore
          retention-days: 7
